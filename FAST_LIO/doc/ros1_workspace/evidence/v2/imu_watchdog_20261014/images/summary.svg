<text x="70" y="660" fill="#edf3fc" font-family="Noto Sans CJK SC" font-size="27">A/B/C：按原始 IMU 源时间排程；C 在约 1 秒后的下一条 IMU 到来前完成两级告警。</text>
<text x="70" y="718" fill="#edf3fc" font-family="Noto Sans CJK SC" font-size="27">D：保留原 bag 记录时序，约 100 ms 一批；非注入的 2～5 秒也出现接收超时 WARNING。</text>
<text x="70" y="776" fill="#edf3fc" font-family="Noto Sans CJK SC" font-size="27">C：短时空窗实际约 155 ms，约 135.7 ms 报 WARNING；空窗期间没有接收超时 ERROR。</text>
<text x="70" y="834" fill="#edf3fc" font-family="Noto Sans CJK SC" font-size="27">恢复帧上的 STAMP_GAP 是源时间间隔检查，不能混算为下一帧到来前的断流告警。</text>
<text x="70" y="892" fill="#b9c9df" font-family="Noto Sans CJK SC" font-size="27">100/200 ms 是阈值；包含调度、传输和观察开销，本次结果不构成硬实时保证。</text>
