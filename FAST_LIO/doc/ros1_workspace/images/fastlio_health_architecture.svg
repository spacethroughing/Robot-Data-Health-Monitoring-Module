<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120" role="img" aria-labelledby="title desc">
  <title id="title">FAST-LIO ROS1 定位健康监控与 RViz 检测台技术架构</title>
  <desc id="desc">展示 rosbag 或 Livox 数据输入、FAST-LIO 定位建图、C++ 健康监控、ROS topics、静态 TF 和 RViz 检测台之间的数据流。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#143b68"/><stop offset="1" stop-color="#265e92"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10263d" flood-opacity="0.10"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3578b8"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#159b77"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8064b2"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif; fill: #19324c; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 16px; fill: #d9e8f7; }
      .section { font-size: 22px; font-weight: 700; }
      .cardtitle { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #52687d; }
      .topic { font-size: 14px; font-weight: 650; fill: #24435f; }
      .tag { font-size: 12px; font-weight: 650; }
      .muted { fill: #60768a; }
      .white { fill: #fff; }
      .box { fill: #fff; stroke: #d7e2ee; stroke-width: 1.5; }
      .topicbox { fill: #f3f8fd; stroke: #cbdced; stroke-width: 1.2; }
      .line { fill: none; stroke: #3578b8; stroke-width: 3; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .linegreen { fill: none; stroke: #159b77; stroke-width: 3; marker-end: url(#arrowGreen); stroke-linecap: round; stroke-linejoin: round; }
      .linepurple { fill: none; stroke: #8064b2; stroke-width: 2.5; marker-end: url(#arrowPurple); stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1840" height="1120" rx="28" fill="url(#background)"/>
  <rect x="28" y="25" width="1784" height="95" rx="20" fill="url(#header)"/>
  <text x="62" y="68" class="title">FAST-LIO ROS1 定位健康监控与 RViz 检测台</text>
  <text x="64" y="98" class="subtitle">ROS Noetic · Catkin · FAST-LIO C++ · C++ 健康节点与 RViz 面板</text>
  <rect x="1408" y="47" width="364" height="47" rx="23" fill="#ffffff" opacity=".14"/>
  <text x="1590" y="77" text-anchor="middle" class="body white" font-weight="700">一次启动 · 输入检查 · 定位建图 · 实时展示</text>

  <rect x="48" y="140" width="1744" height="82" rx="16" fill="#e5eef8" stroke="#c5d8ea" stroke-width="1.4"/>
  <text x="72" y="173" class="cardtitle">统一启动入口</text>
  <text x="72" y="198" class="body">visualization_bag_testbench.launch</text>
  <line x1="365" y1="157" x2="365" y2="205" stroke="#bfd0e1"/>
  <text x="395" y="174" class="body">设置仿真时钟</text>
  <text x="395" y="198" class="small">/use_sim_time=true</text>
  <text x="625" y="174" class="body">启动 FAST-LIO 与健康监控</text>
  <text x="625" y="198" class="small">mapping_avia.launch + health_monitor.launch</text>
  <text x="1030" y="174" class="body">启动静态外参 TF 和 RViz</text>
  <text x="1030" y="198" class="small">body → livox_raw · 健康面板与点云图层</text>
  <text x="1430" y="174" class="body">启动 rosbag 播放器</text>
  <text x="1430" y="198" class="small">--clock · --wait-for-subscribers</text>

  <!-- Runtime container -->
  <rect x="42" y="244" width="1756" height="738" rx="22" fill="#ffffff" opacity=".45" stroke="#b8cce0" stroke-width="1.5" stroke-dasharray="9 8"/>
  <rect x="64" y="231" width="300" height="28" rx="14" fill="#dfeaf5"/>
  <text x="214" y="251" text-anchor="middle" class="small" font-weight="700">运行时 ROS graph · 实机模式改由驱动提供输入</text>

  <!-- Input -->
  <rect x="66" y="282" width="310" height="655" rx="20" class="box" filter="url(#shadow)"/>
  <rect x="66" y="282" width="310" height="59" rx="20" fill="#e9f3fc"/>
  <path d="M66 321 Q66 341 86 341 H356 Q376 341 376 321" fill="#e9f3fc"/>
  <circle cx="96" cy="311" r="13" fill="#4189c7"/>
  <path d="M89 311h14M96 304v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="318" class="section">数据输入</text>
  <text x="91" y="378" class="small">二选一输入源</text>
  <rect x="89" y="395" width="264" height="72" rx="13" fill="#f6f8fc" stroke="#dce4ef"/>
  <text x="108" y="423" class="cardtitle">rosbag 回放</text>
  <text x="108" y="448" class="small">仿真时钟驱动传感器数据</text>
  <text x="221" y="486" class="small" text-anchor="middle">或</text>
  <rect x="89" y="501" width="264" height="72" rx="13" fill="#f6f8fc" stroke="#dce4ef"/>
  <text x="108" y="529" class="cardtitle">Livox 硬件驱动</text>
  <text x="108" y="554" class="small">真实设备输入（本次未实机验证）</text>

  <text x="91" y="614" class="small">ROS 原始传感器 topics</text>
  <rect x="89" y="632" width="264" height="92" rx="14" class="topicbox"/>
  <circle cx="112" cy="661" r="7" fill="#e49a35"/>
  <text x="130" y="666" class="topic">/livox/lidar</text>
  <text x="108" y="691" class="small">livox_ros_driver/CustomMsg</text>
  <text x="108" y="711" class="small">点云与反射强度</text>
  <rect x="89" y="744" width="264" height="92" rx="14" class="topicbox"/>
  <circle cx="112" cy="773" r="7" fill="#4b9c78"/>
  <text x="130" y="778" class="topic">/livox/imu</text>
  <text x="108" y="803" class="small">sensor_msgs/Imu</text>
  <text x="108" y="823" class="small">线加速度与角速度</text>
  <rect x="89" y="856" width="264" height="55" rx="12" fill="#fff7e9" stroke="#f0d8ad"/>
  <text x="221" y="879" text-anchor="middle" class="tag" fill="#94651d">两路输入同时送入</text>
  <text x="221" y="899" text-anchor="middle" class="small">FAST-LIO 与健康监控器</text>

  <!-- Input fan-out bus -->
  <path d="M376 682 H405 V429 H448" class="line"/>
  <path d="M405 682 V790 H448" class="linegreen"/>
  <circle cx="405" cy="682" r="6" fill="#3578b8"/>

  <!-- FAST-LIO -->
  <rect x="448" y="282" width="510" height="307" rx="20" class="box" filter="url(#shadow)"/>
  <rect x="448" y="282" width="510" height="59" rx="20" fill="#eaf3ff"/>
  <path d="M448 321 Q448 341 468 341 H938 Q958 341 958 321" fill="#eaf3ff"/>
  <rect x="474" y="299" width="28" height="27" rx="7" fill="#3578b8"/>
  <path d="M481 313l5 5 10-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="319" class="section">FAST-LIO 定位建图</text>
  <rect x="817" y="298" width="116" height="28" rx="14" fill="#d8eaff"/>
  <text x="875" y="317" text-anchor="middle" class="tag" fill="#2c679e">C++ · laserMapping</text>
  <text x="476" y="371" class="body">融合雷达点云与 IMU，估计位姿并更新 ikd-Tree 地图</text>
  <rect x="474" y="392" width="458" height="50" rx="12" fill="#f4f8fd" stroke="#dce7f2"/>
  <text x="493" y="414" class="small">主要输出</text>
  <text x="493" y="433" class="topic">/cloud_registered · /Odometry · /path · /tf</text>
  <rect x="474" y="454" width="458" height="51" rx="12" fill="#eef8f4" stroke="#cce6db"/>
  <text x="493" y="476" class="small">可视化检测台启用地图发布</text>
  <text x="493" y="495" class="topic">/Laser_map：当前地图完整快照，约 1 Hz</text>
  <text x="476" y="540" class="small">仅有地图订阅者时展平 k-d tree；普通 mapping launch 默认关闭。</text>
  <text x="476" y="563" class="small">快照发布新增于 map_incremental() 之后，定位估计仍由原 FAST-LIO 流程完成。</text>

  <!-- Monitor -->
  <rect x="448" y="638" width="510" height="310" rx="20" class="box" filter="url(#shadow)"/>
  <rect x="448" y="638" width="510" height="59" rx="20" fill="#eaf7f2"/>
  <path d="M448 677 Q448 697 468 697 H938 Q958 697 958 677" fill="#eaf7f2"/>
  <circle cx="488" cy="668" r="15" fill="#199474"/>
  <path d="M488 657v12l8 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="516" y="676" class="section">定位健康监控</text>
  <rect x="817" y="654" width="116" height="28" rx="14" fill="#d6f0e7"/>
  <text x="875" y="673" text-anchor="middle" class="tag" fill="#16795f">C++ 节点</text>
  <text x="476" y="726" class="body">独立订阅原始数据和定位输出，不参与 FAST-LIO 状态估计</text>
  <rect x="474" y="748" width="458" height="75" rx="12" fill="#f5faf8" stroke="#d9ebe4"/>
  <text x="493" y="773" class="topic">LiDAR</text><text x="573" y="773" class="small">点数、有效比例、频率、时间戳</text>
  <text x="493" y="796" class="topic">IMU</text><text x="573" y="796" class="small">新鲜度、数值有限性、幅值</text>
  <text x="493" y="816" class="topic">Odometry</text><text x="593" y="816" class="small">位姿、四元数、协方差、跳变</text>
  <rect x="474" y="838" width="458" height="82" rx="12" fill="#f4f3fa" stroke="#ded8ed"/>
  <text x="493" y="864" class="small">健康汇总：分项取最严重，总体取三项最高等级</text>
  <rect x="493" y="878" width="100" height="27" rx="13" fill="#d9f0e3"/><text x="543" y="897" text-anchor="middle" class="tag" fill="#16734d">0 · OK</text>
  <rect x="605" y="878" width="128" height="27" rx="13" fill="#fff0c9"/><text x="669" y="897" text-anchor="middle" class="tag" fill="#94630b">1 · WARNING</text>
  <rect x="745" y="878" width="116" height="27" rx="13" fill="#fde0e0"/><text x="803" y="897" text-anchor="middle" class="tag" fill="#a53f3f">2 · ERROR</text>

  <!-- Odometry feedback -->
  <path d="M716 589 V628" class="linepurple"/>
  <rect x="734" y="593" width="170" height="26" rx="13" fill="#f1eef8"/>
  <text x="819" y="611" text-anchor="middle" class="tag" fill="#6f579d">/Odometry 送入健康判断</text>

  <!-- RViz -->
  <rect x="1380" y="282" width="386" height="666" rx="20" class="box" filter="url(#shadow)"/>
  <rect x="1380" y="282" width="386" height="59" rx="20" fill="#f1edfa"/>
  <path d="M1380 321 Q1380 341 1400 341 H1746 Q1766 341 1766 321" fill="#f1edfa"/>
  <circle cx="1420" cy="311" r="14" fill="#8064b2"/>
  <path d="M1412 311h16M1420 303v16" stroke="#fff" stroke-width="2"/>
  <text x="1446" y="319" class="section">RViz 检测台</text>
  <rect x="1405" y="365" width="336" height="113" rx="14" fill="#f7f5fb" stroke="#e2dbee"/>
  <text x="1425" y="393" class="cardtitle">健康面板</text>
  <text x="1425" y="420" class="small">总体状态 + LiDAR / IMU / 定位分项</text>
  <text x="1425" y="445" class="small">频率、年龄、有效点、位姿与异常原因</text>
  <text x="1425" y="466" class="small">订阅 /fastlio_health_monitor/diagnostics</text>
  <rect x="1405" y="495" width="336" height="235" rx="14" fill="#f4f8fd" stroke="#d9e5f1"/>
  <text x="1425" y="523" class="cardtitle">实时三维视图</text>
  <circle cx="1430" cy="552" r="5" fill="#5595cf"/><text x="1445" y="557" class="small">雷达原始点云 · intensity 彩虹色</text>
  <circle cx="1430" cy="582" r="5" fill="#e4a23a"/><text x="1445" y="587" class="small">FAST-LIO 当前帧 · /cloud_registered</text>
  <circle cx="1430" cy="612" r="5" fill="#7c69b3"/><text x="1445" y="617" class="small">累积地图 · /Laser_map</text>
  <circle cx="1430" cy="642" r="5" fill="#299677"/><text x="1445" y="647" class="small">定位 /Odometry、轨迹 /path、TF</text>
  <line x1="1425" y1="670" x2="1720" y2="670" stroke="#dce5ef"/>
  <text x="1425" y="696" class="small">固定坐标系：camera_init</text>
  <text x="1425" y="718" class="small">外参链：camera_init → body → livox_raw</text>
  <rect x="1405" y="748" width="336" height="170" rx="14" fill="#fff8ec" stroke="#efdfbf"/>
  <text x="1425" y="777" class="cardtitle">地图显示策略</text>
  <text x="1425" y="804" class="small">Decay Time = 0：新快照到达时再替换</text>
  <text x="1425" y="829" class="small">发布队列 1 + latch：晚加入订阅可取最后快照</text>
  <text x="1425" y="854" class="small">固定 intensity 范围 0–152，减少颜色跳变</text>
  <text x="1425" y="887" class="small">bag 停止后地图保留；健康状态仍会报断流</text>

  <!-- ROS topic interface / handoff -->
  <rect x="1010" y="282" width="320" height="666" rx="20" class="box" filter="url(#shadow)"/>
  <rect x="1010" y="282" width="320" height="59" rx="20" fill="#edf2fa"/>
  <path d="M1010 321 Q1010 341 1030 341 H1310 Q1330 341 1330 321" fill="#edf2fa"/>
  <text x="1040" y="319" class="section">ROS topic 接口</text>
  <rect x="1034" y="370" width="272" height="226" rx="14" class="topicbox"/>
  <text x="1053" y="398" class="cardtitle">FAST-LIO → RViz</text>
  <text x="1053" y="430" class="topic">/cloud_registered</text>
  <text x="1053" y="461" class="topic">/Laser_map</text>
  <text x="1053" y="492" class="topic">/Odometry · /path</text>
  <text x="1053" y="523" class="topic">/tf</text>
  <text x="1053" y="563" class="small">地图发布在有订阅者时触发</text>
  <rect x="1034" y="617" width="272" height="193" rx="14" fill="#f2faf6" stroke="#d0e8dc"/>
  <text x="1053" y="645" class="cardtitle">健康监控 → RViz</text>
  <text x="1053" y="672" class="small">namespace: /fastlio_health_monitor</text>
  <text x="1053" y="702" class="topic">diagnostics · status (UInt8)</text>
  <text x="1053" y="732" class="topic">lidar_raw_visualization</text>
  <text x="1053" y="779" class="small">CustomMsg → xyz/intensity PointCloud2</text>
  <rect x="1034" y="831" width="272" height="86" rx="14" fill="#f5f2fa" stroke="#e0d9ee"/>
  <text x="1053" y="859" class="cardtitle">静态 TF 节点</text>
  <text x="1053" y="887" class="topic">/tf_static · body → livox_raw</text>

  <!-- Output flows -->
  <path d="M958 371 H985 V475 H1010" class="line"/>
  <path d="M958 475 H1010" class="line"/>
  <path d="M958 838 H986 V714 H1010" class="linegreen"/>
  <path d="M1330 480 H1380" class="line"/>
  <path d="M1330 710 H1380" class="linegreen"/>
  <path d="M1330 874 H1352 V690 H1380" class="linepurple dash"/>

  <!-- Health rule callout -->
  <rect x="66" y="967" width="1700" height="78" rx="17" fill="#183d63"/>
  <text x="94" y="997" class="body white" font-weight="700">健康状态如何产生</text>
  <text x="94" y="1024" class="small white">接收年龄 / 频率 + 单帧质量 + 定位连续性</text>
  <line x1="445" y1="984" x2="445" y2="1029" stroke="#6684a2"/>
  <text x="477" y="1000" class="body white">LiDAR：点数 · 有效率 · 时间戳</text>
  <text x="477" y="1025" class="small white">有效点率阈值 80%</text>
  <text x="820" y="1000" class="body white">IMU：数据新鲜度 · 数值与幅值</text>
  <text x="820" y="1025" class="small white">加速度 / 角速度检查</text>
  <text x="1190" y="1000" class="body white">定位：位姿 · 四元数 · 协方差 · 跳变</text>
  <text x="1190" y="1025" class="small white">分项取最高等级 → 总体 OK / WARNING / ERROR</text>

  <text x="64" y="1082" class="small">代码入口：fastlio_health_monitor/src/health_monitor_node.cpp · health_panel.cpp · FAST_LIO/src/laserMapping.cpp</text>
  <text x="1768" y="1082" text-anchor="end" class="small">工程架构示意 · 2026-10-10</text>
</svg>
