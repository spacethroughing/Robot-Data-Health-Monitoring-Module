<g id="node4" class="node">
<title>stop</title>
<polygon fill="#fef3c7" stroke="transparent" points="1.5,-576 1.5,-620 686.5,-620 686.5,-576 1.5,-576"/>
<text text-anchor="start" x="13.5" y="-594.6" font-family="Noto Sans CJK SC" font-weight="bold" font-size="18.00">④ 正常关闭定位：发出 STOP，并等待停止确认</text>
<text text-anchor="start" x="13.5" y="-553.6" font-family="Noto Sans Mono CJK SC" font-size="13.00">rosservice call /robot_runtime/control &quot;{binding: &#39;localization&#39;, command: &#39;STOP&#39;}&quot;</text>
<text text-anchor="start" x="13.5" y="-516.4" font-family="Noto Sans CJK SC" font-size="12.00">服务 accepted 只表示请求收到；继续观察 module_state，直到 observed_state=STOPPED。传感器回放和监控仍在运行。</text>
<text text-anchor="start" x="13.5" y="-479.4" font-family="Noto Sans CJK SC" font-size="12.00">STOPPED 时定位数据不可用、业务有效=false；等待 30 秒不会因计划停机误报定位断流。</text>
<polygon fill="none" stroke="#fde68a" points="0,-463 0,-621 687,-621 687,-463 0,-463"/>
</g>
