<text text-anchor="middle" x="499" y="-1319.8" font-family="Noto Sans CJK SC" font-size="24.00" fill="#0f172a">FAST&#45;LIO 定位健康监控 V2｜使用说明</text>
<text text-anchor="middle" x="499" y="-1293.8" font-family="Noto Sans CJK SC" font-size="24.00" fill="#0f172a">推荐：管理式 rosbag 联调、实时健康观察、正常停止与重启、日志追溯</text>
<!-- prepare -->
<g id="node1" class="node">
<title>prepare</title>
<polygon fill="#dbeafe" stroke="transparent" points="354.5,-1237.5 354.5,-1281.5 724.5,-1281.5 724.5,-1237.5 354.5,-1237.5"/>
<text text-anchor="start" x="366.5" y="-1256.1" font-family="Noto Sans CJK SC" font-weight="bold" font-size="18.00">① 首次使用或源码更新后：加载环境并编译</text>
<text text-anchor="start" x="366.5" y="-1215.1" font-family="Noto Sans Mono CJK SC" font-size="13.00">bash</text>
<text text-anchor="start" x="366.5" y="-1177.1" font-family="Noto Sans Mono CJK SC" font-size="13.00">source /opt/ros/noetic/setup.bash</text>
<text text-anchor="start" x="366.5" y="-1139.1" font-family="Noto Sans Mono CJK SC" font-size="13.00">cd $HOME/fastlio_ws &amp;&amp; catkin_make &#45;j2</text>
<text text-anchor="start" x="366.5" y="-1101.1" font-family="Noto Sans Mono CJK SC" font-size="13.00">source $HOME/fastlio_ws/devel/setup.bash</text>
<text text-anchor="start" x="366.5" y="-1063.9" font-family="Noto Sans CJK SC" font-size="12.00">每个新终端都要 source；仅运行已编译版本时可跳过编译。</text>
<polygon fill="none" stroke="#93c5fd" points="353.5,-1048 353.5,-1283 725.5,-1283 725.5,-1048 353.5,-1048"/>
</g>
<!-- start -->
<g id="node2" class="node">
<title>start</title>
<polygon fill="#dcfce7" stroke="transparent" points="110.5,-978 110.5,-1022 969.5,-1022 969.5,-978 110.5,-978"/>
<text text-anchor="start" x="122.5" y="-996.6" font-family="Noto Sans CJK SC" font-weight="bold" font-size="18.00">② 启动完整 V2 管理式回放</text>
<text text-anchor="start" x="122.5" y="-955.6" font-family="Noto Sans Mono CJK SC" font-size="13.00">roslaunch fastlio_health_monitor managed_bag_testbench.launch</text>
<text text-anchor="start" x="122.5" y="-918.4" font-family="Noto Sans CJK SC" font-size="12.00">自动启动监控器、运行控制器、FAST&#45;LIO、bag、静态 TF 和 RViz；默认传感器/监控配置为 health_v2_managed.yaml，进程组配置为 runtime_bag.yaml。</text>
<text text-anchor="start" x="122.5" y="-881.4" font-family="Noto Sans CJK SC" font-size="12.00">启动失败先看终端 YAML 校验、bag 文件路径、ROS master 与 topic 配置。</text>
<polygon fill="none" stroke="#86efac" points="109,-865 109,-1023 970,-1023 970,-865 109,-865"/>
</g>
