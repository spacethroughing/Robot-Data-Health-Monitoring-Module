<text text-anchor="start" x="248.5" y="-813.6" font-family="Noto Sans CJK SC" font-weight="bold" font-size="18.00">③ 同时观察健康状态、定位输出和运行状态</text>
<text text-anchor="start" x="248.5" y="-773.4" font-family="Noto Sans CJK SC" font-size="12.00">RViz：健康面板查看 overall / LiDAR / IMU / localization；3D 查看原始点云、注册点云、地图、Path 与 TF。</text>
<text text-anchor="start" x="248.5" y="-736.4" font-family="Noto Sans Mono CJK SC" font-size="12.00">rostopic echo /fastlio_health_monitor/diagnostics</text>
<text text-anchor="start" x="248.5" y="-699.4" font-family="Noto Sans Mono CJK SC" font-size="12.00">rostopic echo /robot_runtime/module_state</text>
<text text-anchor="start" x="248.5" y="-662.4" font-family="Noto Sans CJK SC" font-size="12.00">总体等级：OK / WARNING / ERROR；定位还需关注 observed_state、instance_id、业务有效性和原因。</text>
<polygon fill="none" stroke="#c4b5fd" points="235.5,-646 235.5,-840 843.5,-840 843.5,-646 235.5,-646"/>
</g>
