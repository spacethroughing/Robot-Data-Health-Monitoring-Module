<polygon fill="#d1fae5" stroke="transparent" points="186.5,-393 186.5,-437 892.5,-437 892.5,-393 186.5,-393"/>
<text text-anchor="start" x="198.5" y="-411.6" font-family="Noto Sans CJK SC" font-weight="bold" font-size="18.00">⑤ 正常重新启动定位：RUN 并等待新实例就绪</text>
<text text-anchor="start" x="198.5" y="-370.6" font-family="Noto Sans Mono CJK SC" font-size="13.00">rosservice call /robot_runtime/control &quot;{binding: &#39;localization&#39;, command: &#39;RUN&#39;}&quot;</text>
<text text-anchor="start" x="198.5" y="-333.4" font-family="Noto Sans CJK SC" font-size="12.00">观察 STARTING → RUNNING；确认 producer_instance_id 更新，监控用新数据建立时间与运动基线。</text>
<text text-anchor="start" x="198.5" y="-296.4" font-family="Noto Sans CJK SC" font-size="12.00">若要从头重播整份 bag，需按顺序 STOP 定位和 sensors，再 RUN localization 与 sensors；不要让旧定位状态接续新一轮 bag。</text>
<polygon fill="none" stroke="#a7f3d0" points="185.5,-280 185.5,-438 893.5,-438 893.5,-280 185.5,-280"/>
</g>
