<text text-anchor="start" x="170.5" y="-188.4" font-family="Noto Sans CJK SC" font-size="12.00">监控日志：$HOME/fastlio_ws/logs/robot_health/&lt;run_id&gt;/；控制日志：$HOME/fastlio_ws/logs/robot_runtime/&lt;run_id&gt;/。</text>
<text text-anchor="start" x="170.5" y="-151.4" font-family="Noto Sans CJK SC" font-size="12.00">核对 manifest、effective_config、events JSONL、metrics CSV；用 instance_id / command_id / module_epoch 串联启停与异常。</text>
<text text-anchor="start" x="170.5" y="-114.4" font-family="Noto Sans Mono CJK SC" font-size="12.00">python3 $HOME/fastlio_ws/src/fastlio_health_monitor/test/run_fault_bag_tests.py</text>
<text text-anchor="start" x="170.5" y="-77.4" font-family="Noto Sans CJK SC" font-size="12.00">回放结束后按 Ctrl+C 关闭整套 launch。原始 bag 保持不变；错误样例为独立副本。</text>
