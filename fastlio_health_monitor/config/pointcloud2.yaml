# 当前可运行的平面参数配置；注释更新：2026-10-12。
# 所有数值保持原样，现有C++读取这些参数。阈值是原工程经验值，不是已完成设备/平台标定。
# 定位当前没有独立最低频率、加速度、生命周期或结构化日志参数；这些尚未实现。
# 新版后续设计在 FAST_LIO/doc/ros1_workspace/planned_config/health_monitor_v2.example.yaml，不能直接加载。

# 雷达原始输入Topic；必须与驱动/bag一致，不是注册点云或地图Topic。
lidar_topic: "/velodyne_points"
# 私有命名空间的RViz原始点云输出名；默认形成 /fastlio_health_monitor/lidar_raw_visualization。
lidar_visualization_topic: "lidar_raw_visualization"
# 仅设置显示消息frame_id，不变换点坐标；空字符串保留输入frame；需匹配TF。
lidar_visualization_frame: ""
# 输入消息类型：livox_custom=Livox CustomMsg；pointcloud2=标准PointCloud2；与IMU单位无推断关系。
lidar_type: "pointcloud2"
# IMU输入Topic；角速度应是rad/s，加速度输入单位由下一参数显式声明。
imu_topic: "/imu/data"
# 只接受g或mps2；g乘9.80665转换为m/s²，mps2保持；非法值报FATAL并退出。
imu_acceleration_unit: "mps2"
# 定位输出nav_msgs/Odometry；可指向其他算法，但要核对坐标系、频率和连续性。
odometry_topic: "/Odometry"

# Hz；当前C++按WallTimer发布诊断，2Hz约0.5秒一次；不是输入数据的期望频率。
publish_rate_hz: 2.0
# s；接收时间统计窗口。当前只在新消息到达时裁剪，断流时频率可能保留旧值；断流看年龄。
rate_window_sec: 5.0
# s；LiDAR距最后收到消息的WallTime年龄 > 此值升WARNING，不是传输延迟。
lidar_stale_warning_sec: 0.5
# s；LiDAR接收年龄 > 此值升ERROR；当前没有正常停机意图豁免，停止输入仍报错。
lidar_stale_error_sec: 1.5
# s；IMU接收年龄 > 此值升WARNING；即使bag暂停，WallTimer仍检查。
imu_stale_warning_sec: 0.15
# s；IMU接收年龄 > 此值升ERROR；须大于warning阈值，现场按数据周期标定。
imu_stale_error_sec: 0.6
# s；定位输出接收年龄 > 此值升WARNING；与消息header时间戳区别开。
odometry_stale_warning_sec: 0.3
# s；定位输出接收年龄 > 此值升ERROR；当前尚未实现正常停止/重启状态机。
odometry_stale_error_sec: 1.0
# Hz；窗口至少3个接收样本且频率 < 此值为WARNING；当前仅最低频率，无最高频率。
minimum_lidar_rate_hz: 5.0
# Hz；窗口至少3个接收样本且频率 < 此值为WARNING；播放倍率会改变接收频率。
minimum_imu_rate_hz: 50.0
# 点/帧；非空扫描总点数 < 此值为WARNING；空扫描或无有效点为ERROR，不是最低有效点数量。
minimum_lidar_points: 100
# [0,1]；有效坐标点数/总点数 < 此值为WARNING；非有限、近零距离、超量程点无效。
minimum_valid_point_ratio: 0.8
# m；点距离 <= 此值且距离平方 > 1e-8 可参与有效点统计；不等于FAST-LIO预处理blind。
maximum_point_range_m: 500.0
# m/s²；按配置单位换算后的IMU加速度模长（含重力） > 此值为WARNING；非有限为ERROR。经验起点，非硬件量程。
maximum_acceleration_mps2: 100.0
# rad/s；IMU角速度模长 > 此值为WARNING；非有限为ERROR。按传感器/平台标定。
maximum_angular_velocity_rps: 35.0
# m/s；相邻有效位置差/源时间差 > 此值为WARNING；首帧无基线；须小于error速度。
odometry_warning_speed_mps: 15.0
# m/s；位置差分速度 > 此值为ERROR；未考虑加速度或授权重定位，后续方案将补齐。
odometry_error_speed_mps: 50.0
# 当前将位姿6个对角线最大值混合比较，> 此值为WARNING；位置m²/旋转rad²混用，后续须拆开，非通用标准。
maximum_pose_covariance: 100.0
