# 非定位模块接入示例：诊断转发与任务驱动的Path检查；不是识别精度或碰撞安全评估。
# 已实现的 C++ V2 配置；2026-10-12。后续完整规划模板不是本配置的替代品。
# 阈值仅为开发/回放起点；部署前按设备、平台、源采样率标定。
# 下限使用 <，上限使用 >；等于阈值不触发对应级别。NaN/结构错误立即 ERROR。
schema_version: 2  # 未支持字段、拼错字段、单位或依赖环会导致启动失败。
monitor:
  data_reference: ""        # 可填实际bag绝对路径，日志记录SHA-256；实机无bag留空，不猜数据来源。
  publish_rate_hz: 5.0        # Hz；SteadyTimer 发布，不随 bag /clock 暂停停止。
  statistics_window_sec: 5.0 # s；每次诊断裁剪接收/源窗口，断流接收频率降为0。
  min_frequency_samples: 3  # 至少3条消息后才判断频率；不足标 N/A。
  min_frequency_coverage_sec: 1.0 # s；源或接收统计区间覆盖1秒后启用。
  soft_warning_hold_sec: 0.5 # s；软告警持续0.5秒触发；NaN/结构错误/严重运动ERROR立即，候选事件仍记录。
  recovery_hold_sec: 1.0     # s；有通过证据持续1秒恢复；本周期硬错误仍保留。
  diagnostics_topic: "/fastlio_health_monitor/diagnostics" # 通用诊断，兼容现有RViz订阅。
  status_topic: "/fastlio_health_monitor/status" # UInt8：0/1/2；停止/启动为1，硬错误优先2。
control:
  strict_intent: false       # 独立/bag旧入口无需管理端，自动STARTING；正常STOP必须接控制器。
  state_topic: "/robot_runtime/module_state" # 非latched RuntimeState，序号递增心跳。
  heartbeat_warning_sec: 1.0 # s；已接入管理端后，接收年龄>1警告。
  heartbeat_error_sec: 3.0   # s；>3意图失效UNKNOWN/ERROR，不永久信任旧STOP。
stream_defaults:
  stamp_domain: "device_relative" # 本bag头stamp约597秒，绝对传输延迟未实现/显示N/A。
  frequency_basis: "source"  # source=头时间频率，与2倍播放无关；receive=单调接收频率。
  stamp:
    require_positive: true   # stamp必须>0；不自动猜测时钟单位。
    duplicate_level: "WARNING" # 同代际重复，软持续告警。
    regression_level: "ERROR" # 未授权回退立即错误；实例/RESET_FRAME先清历史。
    max_gap_warning_sec: 0.3 # s；相邻源时间差>0.3警告；可分模块覆盖。
    max_gap_error_sec: 1.0   # s；>1严重；不是接收年龄。
lifecycle_defaults:
  startup_deadline_sec: 10.0 # s；RUN后未达到ready期限报STARTUP_TIMEOUT。
  stop_deadline_sec: 5.0     # s；STOP后未确认停止报STOP_FAILED。
  ready_consecutive_samples: 10 # 连续无ERROR样本+频率覆盖+管理进程存活才RUNNING。
logging:
  enabled: true             # 事件JSONL+指标CSV+配置/版本/二进制hash。
  directory: "/tmp/robot_health_monitor/robot_health" # 示例目录；部署时改为持久且可写路径。
  metrics_period_sec: 1.0   # s；指标采样周期，不全量复制200Hz IMU。
  metrics_queue_capacity: 4096 # 普通队列上限；满丢弃并计数。
  critical_event_queue_capacity: 512 # 事件独立容量；满计数/日志ERROR。
  rotate_size_mb: 20        # MB；每文件超过此大小轮转。
  rotate_file_count: 10     # 每种日志保留数；删除旧文件计数，logs_incomplete=true。
  total_budget_mb: 512      # MB；单次run累计写预算，超限停止写并报日志ERROR。
  flush_period_sec: 1.0     # s；普通flush周期；关键启停事件fsync确认最多等待2秒。
modules:
  - id: "perception"
    checker: "RelayChecker" # 已有诊断的C++转发规则；空DiagnosticArray不能当作已报告OK。
    adapter: "DiagnosticRelayAdapter"
    topic: "/perception/diagnostics"
    required: true
    lifecycle:
      control_binding: "perception"
      ready_consecutive_samples: 3
    stream:
      receive_age_sec: {warning_above: 1.0, error_above: 3.0} # s；诊断新鲜度。
      frequency: {warning_below_hz: 0.5, error_below_hz: 0.1, warning_above_hz: 20.0, error_above_hz: 50.0} # Hz。
      stamp: {max_gap_warning_sec: 2.0, max_gap_error_sec: 5.0}
    quality: {} # 没有目标的感知由生产者给出语义诊断；此处不将目标数量0当错误。
  - id: "planning"
    checker: "PlanningChecker" # 无目标IDLE，不要求不断生成路径。
    adapter: "PathAndTaskStateAdapter"
    topic: "/planner/path" # nav_msgs/Path；必须与任务stamp同域。
    required: true
    lifecycle:
      control_binding: "planning"
      ready_consecutive_samples: 3
    quality:
      task_state_topic: "/planner/task_state" # fastlio_health_monitor/TaskState，任务每次变化+周期心跳。
      task_state_timeout_sec: 2.0 # s；任务心跳必须新鲜，无目标也需要管理状态。
      result_deadline_sec: 2.0 # s；有goal时才要求新路径；新goal清旧路径ready。
      maximum_segment_m: 2.0 # m；相邻路径点距离上限，按实际输出分辨率配置。
