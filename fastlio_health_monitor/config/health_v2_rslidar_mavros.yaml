# RSLidar + MAVROS + 包内已有Odometry，供recorded_bag_health.launch使用。
# 原始证据test_config.yaml独立保留；此文件是新roslaunch入口的可编辑参数源。
# 0.1/0.2秒IMU接收超时、100Hz检查及其余阈值继承用户当前测试配置。
# 不修复/修改bag消息；原雷达首帧零时间戳、源间隔与运动告警均原样判断。
# 修改后重启加载；注释掉参数通常会回退默认值，并不等于关闭检测。
# 阈值字段below/above采用严格小于/大于；单位由所在指标名/注释给出。
schema_version: 2
# 单调墙钟定时检查，不等待下一条传感器消息；配置改后重新启动launch。
monitor:
  data_reference: ''
  publish_rate_hz: 100.0  # Hz；当前100Hz，理想检查间隔10ms，实际调度可能更晚。
  statistics_window_sec: 5.0
  min_frequency_samples: 3
  min_frequency_coverage_sec: 1.0
  soft_warning_hold_sec: 0.0  # 秒；0表示不额外等待软告警消抖。
  recovery_hold_sec: 1.0  # 秒；恢复需连续满足通过条件的保持时间。
  diagnostics_topic: /fastlio_health_monitor/diagnostics
  status_topic: /fastlio_health_monitor/status
# 本launch的C++播放器发送非latched控制心跳，暂停/结束对应PAUSED/STOPPED。
control:
  strict_intent: false
  state_topic: /robot_runtime/module_state
  heartbeat_warning_sec: 1.0
  heartbeat_error_sec: 3.0
# 源时间戳规则与接收年龄独立：前者查消息头，后者查距上次回调的单调时间。
stream_defaults:
  stamp_domain: ros_time  # 源时钟域标签；不能据此声称已验证绝对传输延迟。
  frequency_basis: source  # source按头时间计算，不把2倍速回放当成传感器频率翻倍。
  stamp:
    require_positive: true  # 头时间戳必须大于0；原bag首帧雷达为0，仍应被检测为异常。
    duplicate_level: WARNING
    regression_level: ERROR
    max_gap_warning_sec: 0.3  # 秒；相邻消息头间隔超过此值触发WARNING。
    max_gap_error_sec: 1.0  # 秒；相邻消息头间隔超过此值触发ERROR。
# 本bag开头雷达约44秒、定位约64秒才开始；当前10秒期限会报启动缺数，随后随有效数据恢复。
lifecycle_defaults:
  startup_deadline_sec: 10.0
  stop_deadline_sec: 5.0
  ready_consecutive_samples: 10
# 每次运行创建新run目录：events.*.jsonl、metrics.*.csv、配置与版本快照。
logging:
  enabled: true
  directory: /home/lmw/fastlio_ws/logs/robot_health
  metrics_period_sec: 1.0
  metrics_queue_capacity: 4096
  critical_event_queue_capacity: 512
  rotate_size_mb: 20
  rotate_file_count: 10
  total_budget_mb: 512
  flush_period_sec: 1.0
# 改topic时，也需给launch传入匹配的lidar_topic/imu_topic/localization_topic参数。
modules:
# 雷达PointCloud2：数量、有限/范围内有效点比例、源频率、时间戳、接收年龄。
- id: lidar
  checker: LidarChecker
  adapter: PointCloud2Adapter
  topic: /rslidar_points
  required: true
  visualization_topic: /fastlio_health_monitor/lidar_raw_visualization
  visualization_frame: ''  # 保留rslidar原frame；无真实TF时不伪造外参变换。
  lifecycle:
    control_binding: sensors
  stream:
    receive_age_sec:  # 秒；单调定时探针检查连续多久未接收，不等待下条数据。
      warning_above: 0.3
      error_above: 0.5
    frequency:  # Hz；below为下限、above为上限，warning/error分别对应告警级别。
      warning_below_hz: 8.0
      error_below_hz: 5.0
      warning_above_hz: 12.0
      error_above_hz: 20.0
  quality:
    points_total:  # 每帧点数；warning_below/error_below使用严格小于。
      warning_below: 100
      error_below: 1
    points_valid:  # 有限且在range_m内的点数；无有效点立即ERROR。
      warning_below: 100
      error_below: 1
    valid_ratio:  # 有效点数/总点数；0到1。
      warning_below: 0.8
      error_below: 0.5
    range_m:  # 米；范围外的点不计入有效点。
      minimum: 0.0001
      maximum: 500.0
# MAVROS IMU：SI加速度/角速度、有限值、协方差可用性、源间隔与接收超时。
- id: imu
  checker: ImuChecker
  adapter: RosImuAdapter
  topic: /mavros/imu/data_raw
  required: true
  lifecycle:
    control_binding: sensors
  stream:
    receive_age_sec:  # 秒；单调定时探针检查连续多久未接收，不等待下条数据。
      warning_above: 0.1
      error_above: 0.2
    frequency:  # Hz；below为下限、above为上限，warning/error分别对应告警级别。
      warning_below_hz: 160.0
      error_below_hz: 50.0
      warning_above_hz: 260.0
      error_above_hz: 400.0
    stamp:
      max_gap_warning_sec: 0.1  # 秒；相邻消息头间隔超过此值触发WARNING。
      max_gap_error_sec: 0.2  # 秒；相邻消息头间隔超过此值触发ERROR。
  quality:
    acceleration_unit: mps2  # MAVROS按m/s²输入，不乘Livox的g换算系数。
    angular_velocity_unit: radps  # rad/s；不是角度每秒。
    acceleration_content: specific_force  # specific_force含重力，静止加速度模长通常约9.8m/s²。
    required_measurements:
      acceleration: true
      angular_velocity: true
      orientation: false
    acceleration_norm_mps2:
      warning_above: 100.0
      error_above: 200.0
    angular_velocity_norm_rps:
      warning_above: 35.0
      error_above: 70.0
    covariance:
      enabled: true
      required_for_valid: false
      unknown_policy: report_only
      acceleration_unit: input_squared  # 协方差用输入加速度单位的平方；此处为(m/s²)²，缩放系数为1。
      require_symmetric: true
      require_psd: true
      numeric_tolerance: 1.0e-09
# 直接检测bag内已有定位，不在本launch中重新运行FAST-LIO。
- id: localization
  checker: LocalizationChecker
  adapter: OdometryAdapter
  topic: /Odometry
  required: true
  depends_on:
  - lidar
  - imu
  lifecycle:
    control_binding: localization
  stream:
    receive_age_sec:  # 秒；单调定时探针检查连续多久未接收，不等待下条数据。
      warning_above: 0.3
      error_above: 1.0
    frequency:  # Hz；below为下限、above为上限，warning/error分别对应告警级别。
      warning_below_hz: 5.0
      error_below_hz: 1.0
      warning_above_hz: 15.0
      error_above_hz: 30.0
  quality:
    expected_pose_frame: camera_init  # 位置参考系；本包为camera_init。
    expected_child_frame: body  # 机体坐标系；本包为body。
    continuity: continuous_odometry
    quaternion_norm_error:
      warning_above: 0.02
      error_above: 0.1
    kinematics:
      velocity_source: position_difference
      dt_min_sec: 0.001
      dt_max_sec: 1.0
      speed_mps:
        warning_above: 15.0
        error_above: 50.0
      acceleration_mps2:
        warning_above: 10.0
        error_above: 30.0
      angular_speed_rps:
        warning_above: 3.0
        error_above: 10.0
    covariance:
      enabled: true
      required_for_valid: false
      zero_matrix_policy: unknown_warning  # 全零协方差按未知处理，不解释为零误差。
      require_symmetric: true
      require_psd: true
      numeric_tolerance: 1.0e-09
      position_variance_m2:  # 位置协方差阈值，单位m²；非定位真值误差。
        warning_above: 1.0
        error_above: 4.0
      orientation_variance_rad2:  # 姿态协方差阈值，单位rad²。
        warning_above: 0.1
        error_above: 0.5
    jump:
      residual_m:  # 米；相对运动预测的位置跳变残差。
        warning_above: 0.5
        error_above: 2.0
      rotation_rad:  # 弧度；相邻姿态旋转跳变阈值。
        warning_above: 0.3
        error_above: 1.0
